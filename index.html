<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Robot playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #DCE3EA; --ink: #1C2530; --muted: #56636F;
  --orange: #FF4F00; --panel: rgba(255,255,255,0.75); --ring: rgba(28,37,48,0.18);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Helvetica Neue", Arial, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #18202A; --ink: #E6ECF2; --muted: #9AA7B4; --panel: rgba(24,32,42,0.8); --ring: rgba(230,236,242,0.2); }
}
:root[data-theme="dark"] { --bg: #18202A; --ink: #E6ECF2; --muted: #9AA7B4; --panel: rgba(24,32,42,0.8); --ring: rgba(230,236,242,0.2); }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
#app { position: relative; height: 100%; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.title { position: absolute; top: 1rem; left: 1.25rem; right: 1.25rem; pointer-events: none; }
.title h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.6rem, 5vw, 2.4rem); letter-spacing: -0.03em; line-height: 1; margin: 0 0 0.35rem; }
.title p { margin: 0; color: var(--muted); font-size: 0.95rem; max-width: 24rem; line-height: 1.4; }
.keys { display: none; }
@media (hover: hover) and (pointer: fine) { .keys { display: inline; } .touch-hint { display: none; } }

.emotes { position: absolute; top: 1rem; right: 1.25rem; display: flex; gap: 0.5rem; }
.chip { font: 600 0.95rem var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--ring); border-radius: 999px; padding: 0.55rem 1rem; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.chip:focus-visible, .jump:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
@media (max-width: 560px) { .emotes { top: auto; bottom: calc(10.5rem + env(safe-area-inset-bottom, 0px)); right: 1.25rem; flex-direction: column; } }

.stick { position: absolute; left: 1.5rem; bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)); width: 8.5rem; height: 8.5rem; border-radius: 50%; background: var(--panel); border: 2px solid var(--ring); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); touch-action: none; }
.knob { position: absolute; left: 50%; top: 50%; width: 3.6rem; height: 3.6rem; margin: -1.8rem 0 0 -1.8rem; border-radius: 50%; background: var(--ink); opacity: 0.85; pointer-events: none; }
.jump { position: absolute; right: 1.5rem; bottom: calc(2.25rem + env(safe-area-inset-bottom, 0px)); width: 6.5rem; height: 6.5rem; border-radius: 50%; border: 0; background: var(--orange); color: #fff; font: 700 1.2rem var(--display); box-shadow: 0 10px 30px -8px rgba(255,79,0,0.6); cursor: pointer; touch-action: none; }
.jump:active { transform: scale(0.94); }

.loading { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 600; color: var(--muted); }
.loading[hidden] { display: none; }
</style>
</head>
<body>
<div id="app">
  <div class="title">
    <h1>Robot playground</h1>
    <p><span class="touch-hint">Drag the left circle to walk, push it further to run. Tap Jump to jump.</span><span class="keys">Move with WASD or the arrow keys, hold Shift to run, press Space to jump.</span></p>
  </div>
  <div class="emotes">
    <button class="chip" data-emote="Wave" type="button">Wave</button>
    <button class="chip" data-emote="Dance" type="button">Dance</button>
    <button class="chip" data-emote="ThumbsUp" type="button">Thumbs up</button>
  </div>
  <div class="stick" id="stick" aria-label="Movement joystick"><div class="knob" id="knob"></div></div>
  <button class="jump" id="jumpBtn" type="button">Jump</button>
  <div class="loading" id="loading">Loading the robot…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script>

(function () {
  var app = document.getElementById('app');
  var loadingEl = document.getElementById('loading');
  var css = getComputedStyle(document.documentElement);
  function cssColor(name) { return new THREE.Color(css.getPropertyValue(name).trim() || '#DCE3EA'); }

  // ---------- Scene ----------
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  app.insertBefore(renderer.domElement, app.firstChild);

  var scene = new THREE.Scene();
  var bg = cssColor('--bg');
  scene.background = bg;
  scene.fog = new THREE.Fog(bg, 18, 38);

  var camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a97a6, 0.9));
  var sun = new THREE.DirectionalLight(0xffffff, 1.1);
  sun.position.set(4, 10, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
  sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
  scene.add(sun); scene.add(sun.target);

  // Ground: a big disc with rings so you can see yourself moving
  var ARENA = 16;
  var groundMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
  groundMat.color = cssColor('--bg').clone().offsetHSL(0, 0, -0.06);
  var ground = new THREE.Mesh(new THREE.CircleGeometry(ARENA + 1, 64), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  var grid = new THREE.PolarGridHelper(ARENA, 16, 8, 64, 0x8a97a6, 0x8a97a6);
  grid.material.opacity = 0.35; grid.material.transparent = true;
  grid.position.y = 0.01;
  scene.add(grid);

  // A few orange markers to run around
  var markerMat = new THREE.MeshStandardMaterial({ color: 0xFF4F00, roughness: 0.6 });
  [[4, -3], [-5, -6], [7, 5], [-6, 4], [0, -10], [10, -6]].forEach(function (p) {
    var m = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.9, 20), markerMat);
    m.position.set(p[0], 0.45, p[1]); m.castShadow = true; scene.add(m);
  });

  // ---------- Character ----------
  var player = new THREE.Group();
  scene.add(player);
  var mixer = null, actions = {}, current = null;
  var ONE_SHOT = { Jump: 1, Wave: 1, ThumbsUp: 1, Yes: 1, No: 1, Punch: 1 };

  function fadeTo(name, dur) {
    var next = actions[name];
    if (!next || next === current) return;
    next.reset();
    next.setEffectiveWeight(1);
    next.play();
    if (current) current.crossFadeTo(next, dur || 0.2, false);
    current = next;
  }

  function onModel(gltf) {
    var model = gltf.scene;
    model.traverse(function (o) { if (o.isMesh) { o.castShadow = true; } });
    var box = new THREE.Box3().setFromObject(model);
    var h = box.max.y - box.min.y;
    var s = 1.8 / h;
    model.scale.setScalar(s);
    model.position.y = -box.min.y * s;
    player.add(model);

    mixer = new THREE.AnimationMixer(model);
    gltf.animations.forEach(function (clip) {
      var a = mixer.clipAction(clip);
      if (ONE_SHOT[clip.name] || clip.name === 'Dance') {
        a.setLoop(clip.name === 'Dance' ? THREE.LoopRepeat : THREE.LoopOnce);
        a.clampWhenFinished = true;
      }
      actions[clip.name] = a;
    });
    mixer.addEventListener('finished', function (e) {
      if (e.action === actions.Jump) return;
      emote = null;
    });
    fadeTo('Idle', 0);
    loadingEl.hidden = true;
  }
  function onError(err) {
    console.error(err);
    loadingEl.textContent = 'The robot didn\u2019t load. Check that RobotExpressive.glb is next to this page, then refresh.';
  }

  var loader = new THREE.GLTFLoader();
  if (window.MODEL_B64) {
    var bin = atob(window.MODEL_B64), buf = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    loader.parse(buf.buffer, '', onModel, onError);
  } else {
    loader.load('RobotExpressive.glb', onModel, undefined, onError);
  }

  // ---------- Input ----------
  var input = { x: 0, z: 0, mag: 0 };
  var keys = {};
  var jumpQueued = false;
  var emote = null;

  window.addEventListener('keydown', function (e) {
    keys[e.code] = true;
    if (e.code === 'Space') { jumpQueued = true; e.preventDefault(); }
    if (e.code.indexOf('Arrow') === 0) e.preventDefault();
  });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });
  window.addEventListener('blur', function () { keys = {}; });

  // Joystick
  var stick = document.getElementById('stick');
  var knob = document.getElementById('knob');
  var stickId = null, joy = { x: 0, y: 0 };
  function stickMove(e) {
    var r = stick.getBoundingClientRect();
    var max = r.width / 2;
    var dx = e.clientX - (r.left + max), dy = e.clientY - (r.top + max);
    var d = Math.hypot(dx, dy);
    if (d > max) { dx *= max / d; dy *= max / d; }
    joy.x = dx / max; joy.y = dy / max;
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  }
  stick.addEventListener('pointerdown', function (e) { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e); e.preventDefault(); });
  stick.addEventListener('pointermove', function (e) { if (e.pointerId === stickId) stickMove(e); });
  function stickEnd(e) { if (e.pointerId !== stickId) return; stickId = null; joy.x = joy.y = 0; knob.style.transform = ''; }
  stick.addEventListener('pointerup', stickEnd);
  stick.addEventListener('pointercancel', stickEnd);

  var jumpBtn = document.getElementById('jumpBtn');
  jumpBtn.addEventListener('pointerdown', function (e) { jumpQueued = true; e.preventDefault(); });
  jumpBtn.addEventListener('click', function (e) { if (e.detail === 0) jumpQueued = true; }); // keyboard activation

  document.querySelectorAll('.chip').forEach(function (b) {
    b.addEventListener('click', function () {
      if (!mixer || airborne) return;
      emote = b.getAttribute('data-emote');
      fadeTo(emote, 0.25);
      b.blur();
    });
  });

  function readInput() {
    var x = joy.x, z = joy.y, run = false;
    var kx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    var kz = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
    if (kx || kz) { x = kx; z = kz; var l = Math.hypot(x, z); x /= l; z /= l; run = !!(keys.ShiftLeft || keys.ShiftRight); }
    var mag = Math.min(1, Math.hypot(x, z));
    if (!(kx || kz)) run = mag > 0.8;
    input.x = x; input.z = z; input.mag = mag < 0.15 ? 0 : mag; input.run = run;
  }

  // ---------- Game loop ----------
  var clock = new THREE.Clock();
  var vy = 0, airborne = false, facing = 0;
  var GRAVITY = -22, JUMP_V = 7.5, WALK = 2.2, RUN = 5.5;
  var camOffset = new THREE.Vector3(0, 4.2, 7.5);
  var camTarget = new THREE.Vector3();

  function angleLerp(a, b, t) {
    var d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
    return a + d * t;
  }

  function update(dt) {
    readInput();
    var moving = input.mag > 0;

    if (moving && emote) { emote = null; }

    if (moving) {
      var speed = input.run ? RUN : WALK * (0.6 + 0.4 * input.mag);
      player.position.x += input.x / (input.mag || 1) * input.mag * speed * dt;
      player.position.z += input.z / (input.mag || 1) * input.mag * speed * dt;
      facing = angleLerp(facing, Math.atan2(input.x, input.z), Math.min(1, dt * 12));
      player.rotation.y = facing;
      // stay inside the arena
      var r = Math.hypot(player.position.x, player.position.z);
      if (r > ARENA - 0.5) { player.position.x *= (ARENA - 0.5) / r; player.position.z *= (ARENA - 0.5) / r; }
    }

    if (jumpQueued && !airborne && mixer) {
      vy = JUMP_V; airborne = true; emote = null;
      fadeTo(moving ? 'WalkJump' : 'Jump', 0.1);
      if (actions.Jump) actions.Jump.timeScale = 1.4;
    }
    jumpQueued = false;

    if (airborne) {
      vy += GRAVITY * dt;
      player.position.y += vy * dt;
      if (player.position.y <= 0) { player.position.y = 0; vy = 0; airborne = false; }
    }

    if (mixer && !airborne && !emote) {
      fadeTo(moving ? (input.run ? 'Running' : 'Walking') : 'Idle', 0.2);
    }
    if (mixer) mixer.update(dt);

    // camera follows smoothly
    camTarget.lerp(new THREE.Vector3(player.position.x, 1.1, player.position.z), Math.min(1, dt * 6));
    camera.position.copy(camTarget).add(camOffset);
    camera.lookAt(camTarget);
    sun.position.set(camTarget.x + 4, 10, camTarget.z + 6);
    sun.target.position.copy(camTarget);
  }

  function resize() {
    var w = app.clientWidth, h = app.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camOffset.set(0, w < h ? 5 : 4.2, w < h ? 9.5 : 7.5);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  renderer.setAnimationLoop(function () {
    var dt = Math.min(clock.getDelta(), 0.05);
    update(dt);
    renderer.render(scene, camera);
  });
})();
</script>
</body>
</html>
